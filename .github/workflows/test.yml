# Installs the formula from source on macOS and Linux, runs its test and
# Homebrew's style checks, on every push and pull request.
name: Test formula

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Use this checkout as the tap
        run: |
          tap="$(brew --repository)/Library/Taps/zehraduymaz/homebrew-tap"
          rm -rf "$tap"
          mkdir -p "$(dirname "$tap")"
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$tap"
          git -C "$tap" fetch origin "$GITHUB_SHA"
          git -C "$tap" checkout --detach "$GITHUB_SHA"

      - name: Check style
        run: brew audit --strict zehraduymaz/tap/potter

      - name: Install from source
        run: brew install --build-from-source zehraduymaz/tap/potter

      - name: Test
        run: brew test zehraduymaz/tap/potter
