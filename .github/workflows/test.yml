# Installs the formula from source on macOS and Linux, runs its test and
# Homebrew's style checks, on every push and pull request.
name: Test formula

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false  # a failure on one system doesn't cancel the other
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Also checks out this repo and links it in as the tap
      # zehraduymaz/tap, so the formula tested is the one in this commit.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Check style
        run: brew audit --strict zehraduymaz/tap/potter

      - name: Install from source
        run: brew install --build-from-source --verbose zehraduymaz/tap/potter

      - name: Test
        run: brew test zehraduymaz/tap/potter
